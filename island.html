<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162b36"><meta name="description" content="Jump between falling equation platforms, solve the nearest platform, and stay above the spikes. An endless algebra game in English and Somali."><title>Mystery Island — Sky Climb</title><link rel="stylesheet" href="style.css?v=sky-climb-3"><script src="shared/equations.js" defer></script><script src="island-model.js?v=sky-climb-3" defer></script><script src="app.js?v=sky-climb-3" defer></script></head>
<body>
<header class="game-header"><a class="game-brand" href="index.html" aria-label="Mystery Island"><span class="brand-crystal">◆</span><span>MYSTERY<span>ISLAND</span></span></a><div class="language-switch"><button data-lang="en" id="language-en" aria-pressed="true">English</button><button data-lang="so" id="language-so" aria-pressed="false" lang="so">Soomaali</button></div><div class="header-actions"><button id="pause-battle" class="icon-button" aria-label="Pause">Ⅱ</button><button id="sound" class="icon-button" aria-pressed="false" aria-label="Enable sound">♪<span>OFF</span></button><button id="motion" class="icon-button" aria-pressed="false" aria-label="Reduce animation">✧</button></div></header>
<main class="game-shell">
<div class="adventure-top"><div><p id="world-label">AN ENDLESS SKY ADVENTURE</p><h1 id="level-title">Solve it. Jump. Stay above the spikes.</h1></div><div class="island-map" id="island-map">◆ · · ◆ · · ∞</div><div class="star-counter"><span>↟</span><b id="star-count">0</b><span>∞</span></div></div>
<section class="game-frame climb-frame">
<div class="arena" id="arena">
<svg id="climb-svg" viewBox="0 0 900 620" role="img" aria-label="Three falling equation platforms above spikes"><defs><linearGradient id="climb-stone" x2="0" y2="1"><stop stop-color="#b4d697"/><stop offset=".25" stop-color="#79a56a"/><stop offset=".3" stop-color="#a38765"/><stop offset="1" stop-color="#6c7560"/></linearGradient><linearGradient id="spike-fill" x2="0" y2="1"><stop stop-color="#ebac96"/><stop offset="1" stop-color="#965b66"/></linearGradient><linearGradient id="target-stone" x2="0" y2="1"><stop stop-color="#ffe8a2"/><stop offset=".25" stop-color="#d6b66b"/><stop offset="1" stop-color="#8a7c53"/></linearGradient></defs><image href="assets/sky-climb.svg" width="900" height="620"/><g id="launch-ledge"><rect x="-110" y="0" width="220" height="20" rx="8" fill="url(#climb-stone)"/><path d="M-100 19H100L75 43 20 65-50 49Z" fill="#829471"/><text id="launch-label" x="0" y="40" text-anchor="middle">START</text></g><g id="platform-layer"></g><g id="climber"><image href="assets/character.svg" x="-32" y="-79" width="64" height="79"/></g><path class="spike-bed" id="spike-bed" fill="url(#spike-fill)"/><text id="spike-label" x="450" y="613" text-anchor="middle">SPIKES</text></svg>
<div class="mission-hud"><span class="mission-icon">↟</span><div><span id="mission-caption">SKY CLIMB</span><b id="mission-name">Find the nearest platform</b></div></div><div class="phase-track" id="phase-track"></div><div class="climb-toast" id="world-message" role="status" aria-live="polite"></div><div id="reward-layer" class="reward-layer"></div>
</div>
<div class="dialogue-dock" id="dialogue-dock"><div class="guide-avatar" aria-hidden="true"><span>✦</span></div><div class="dialogue-content"><div class="speaker" id="speaker">PIP · YOUR SKY GUIDE</div><h2 id="dialogue-title">Your next jump</h2><p id="dialogue-text"></p><div class="game-feedback" id="feedback" role="status" aria-live="polite"></div><div id="interaction"></div></div><div class="dock-actions" id="dock-actions"></div></div>
</section>
<div class="game-footer"><a class="arcade-return" id="arcade-return" href="index.html">← Algebra games</a><span id="journey-note">SOLVE · JUMP · KEEP CLIMBING</span><button id="restart">New adventure</button></div>
</main>
</body></html>
